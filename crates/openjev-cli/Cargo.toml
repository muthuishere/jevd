[package]
name = "openjev-cli"
description = "The openjev binary: NLI over HTTP, and the one-shot commands that compose in a pipeline."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "openjev"
path = "src/main.rs"

[dependencies]
openjev-core = { path = "../openjev-core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["limit", "cors", "timeout", "trace", "set-header"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
fs4 = { version = "1", features = ["sync"] }
indicatif = "0.18"
sha2 = "0.11"
subtle = "2"
rand = "0.9"
dirs = "7"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Pass-throughs. A backend the binary was not built with must fail loudly naming the
# feature, so the feature names here are exactly the ones the error message prints.
backend-llamacpp = ["openjev-core/backend-llamacpp"]
metal = ["backend-llamacpp", "openjev-core/metal"]
cuda = ["backend-llamacpp", "openjev-core/cuda"]
vulkan = ["backend-llamacpp", "openjev-core/vulkan"]
