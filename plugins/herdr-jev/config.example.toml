# herdr-jev — copy to $HERDR_PLUGIN_CONFIG_DIR/config.toml and edit.
# Every value below is the default; the file is optional in its entirety.

[openjev]
mode    = "attach"   # "attach": find a running server and never own it.
                     # "spawn":  run our own on --port 0 with a private state file.
url     = ""         # explicit URL; wins over every other discovery step
timeout = "20s"
bin     = "openjev"  # spawn mode only
model   = ""

# ---------------------------------------------------------------------------
# The short circuit: answer the task locally instead of invoking an agent.
# OFF by default — see docs/adr/0006. Turn on `shadow` first, read a week of
# `herdr-jev why`, then set `enabled`.
# ---------------------------------------------------------------------------
[answer]
enabled         = false
shadow          = false   # log what it WOULD have answered; dispatch anyway
min_confidence  = 0.85    # separate from, and above, the routing bars (adr 0004)
grade_threshold = 0.5

# ---------------------------------------------------------------------------
# The bars are DIFFERENT on purpose. The two mistakes do not cost the same, so
# they do not clear the same bar (adr 0002). Do not tidy them into one number.
# ---------------------------------------------------------------------------
[policy]
min_upgrade_confidence   = 0.30   # spend more: wrong costs money (recoverable)
min_downgrade_confidence = 0.60   # spend less: wrong means a real task got too little
budget_ms                = 800    # past this, the task is dispatched untouched
route_model   = true
route_effort  = true
log_decisions = true

# ---------------------------------------------------------------------------
# Per agent kind, because claude/codex/gemini name their models differently.
# The decision model never sees any of these names — it ranks the WORK.
#
# THESE ARE GUESSES. Herdr's kind enum is verified; these model names and flags
# are not. Vendors rename both without asking us, and the failure is invisible:
# herdr-jev logs a confident decision, builds --model gpt-5-mini, and the binary
# ignores it. Every other failure here degrades into pass-through; this one
# degrades into a lie.
#
#   herdr-jev doctor --probe
#
# reads each agent's own --help and reports ok / FAIL / ?? per mapping. It never
# edits this file — an auto-fix guessing a replacement name would reintroduce the
# same error with more confidence. Probing is a check, not a gate: routing works
# whether or not it has ever been run.
# ---------------------------------------------------------------------------
[agents.claude]
tiers        = { fast = "haiku", balanced = "sonnet", deep = "opus" }
model_flag   = "--model"
family_hints = { haiku = 0, sonnet = 1, opus = 2 }
# No effort_flag: Claude Code exposes none we can rely on across versions, so
# effort is not routed for it — and the plan SAYS so rather than dropping it.

[agents.codex]
tiers         = { fast = "gpt-5-mini", balanced = "gpt-5", deep = "gpt-5" }
model_flag    = "--model"
effort_flag   = "-c"                     # -> -c model_reasoning_effort=<value>
effort_values = { xhigh = "high" }       # our ladder -> this agent's vocabulary
family_hints  = { mini = 0, "gpt-5" = 1 }

# ---------------------------------------------------------------------------
# The SECONDARY pane router: which already-running pane was this message for.
# A floor alone is not enough — 0.86 against 0.85 clears any sane floor and is
# still a coin flip. Near-ties are where misroutes live, so both apply.
# ---------------------------------------------------------------------------
[routing]
floor            = 0.55   # below this: hold and ask, never guess
margin           = 0.10   # top must beat second by this
max_output_chars = 1200
output_lines     = 40
include_working  = true
exclude_agents     = []
exclude_workspaces = []

[journal]
keep = 500
