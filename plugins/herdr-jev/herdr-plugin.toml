id = "dev.deemwar.herdr-jev"
name = "herdr-jev"
version = "0.1.0"
description = "Answer it, route it, or get out of the way. A local openjev cross-encoder answers decision-shaped tasks outright (no agent, no tokens, nothing off the machine), and otherwise picks the model tier and reasoning effort the agent starts with. Never blocks a task."
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]

[[build]]
command = ["./scripts/build.sh"]

# Startup hooks are one-shot and unsupervised, so `daemon` fork-execs the real
# supervisor and returns immediately. `serve` holds an exclusive flock on the pidfile,
# which makes a repeated hook (every session restore) harmless.
#
# In `attach` mode this exits 0 immediately: there is no child to own, and a supervisor
# with nothing to supervise only produces logs. See SPEC.md §8.
[[startup]]
command = ["./bin/herdr-jev", "daemon"]

# ---------------------------------------------------------------------------
# Ids are namespaced `jev:` because `herdr plugin action invoke` takes --plugin as
# OPTIONAL, so a bare `route` would collide with any other plugin defining one.
# Verified on 0.9.x: `:` is a legal id character, `.` is rejected.
# ---------------------------------------------------------------------------

# THE verb, and the three stages in one call (SPEC.md §4-§6): answer the task locally if
# it is decision-shaped and the local model is sure, otherwise pick the model tier and
# reasoning effort and start the agent with them, otherwise pass it through untouched.
#
# Herdr has no UserPromptSubmit hook and no prompt interception, so this is not a filter
# in front of Herdr's prompt box — it is our own submit path. Routing happens at
# agent.start, which is the only moment Herdr lets anyone choose an agent's model.
[[actions]]
id = "jev:dispatch"
title = "Dispatch a task (answer it, or size the agent for it)"
description = "Answer locally when the model is sure; otherwise start the agent on the right tier and effort"
command = ["./bin/herdr-jev", "dispatch"]
contexts = ["global", "pane"]

# Decide and explain, start nothing, answer nothing. The honest way to build trust in
# the bars before letting them spend money or replace an agent's work.
[[actions]]
id = "jev:dry-run"
title = "Decide without acting"
description = "Show the tier, effort, risk and what would have been done; change nothing"
command = ["./bin/herdr-jev", "dispatch", "--dry-run", "--explain"]
contexts = ["global", "pane"]

# The short circuit on its own. Useful before trusting it inside dispatch, and useful
# on its own terms: a yes/no answered in milliseconds, with nothing leaving the machine.
[[actions]]
id = "jev:ask"
title = "Answer a question locally"
description = "Answer a yes/no or pick-one question with the local model, or say why it declined"
command = ["./bin/herdr-jev", "ask"]
contexts = ["global", "pane"]

# What the decision model says, before any policy. Separating this from what the policy
# did is what makes a deliberate no-op distinguishable from a plugin that never loaded.
[[actions]]
id = "jev:classify"
title = "Classify a task"
description = "The raw tier, effort and risk answers with their confidences"
command = ["./bin/herdr-jev", "classify"]
contexts = ["global", "pane"]

# The saving IS the product: without a number, "it sometimes answers things itself" is
# a claim rather than a result.
[[actions]]
id = "jev:savings"
title = "How many tasks never reached an agent"
description = "Tasks answered locally, routed, and passed through"
command = ["./bin/herdr-jev", "savings"]
contexts = ["global"]

# --- secondary: the pane router ---------------------------------------------

[[actions]]
id = "jev:route"
title = "Route a message to the right OPEN pane"
description = "Rank every running pane against the message and deliver it to the best match"
command = ["./bin/herdr-jev", "route"]
contexts = ["global", "pane"]

# A decision that cannot be reconstructed afterwards cannot be tuned, and an untunable
# router gets switched off. Every candidate's score is journalled. See SPEC.md §7.
[[actions]]
id = "jev:why"
title = "Why that decision?"
description = "The last decisions: what the model said, what the policy did, and why"
command = ["./bin/herdr-jev", "why"]
contexts = ["global", "pane"]

[[actions]]
id = "jev:panes"
title = "Candidates as the router sees them"
description = "Every rankable pane, with the exact distilled text sent to the model"
command = ["./bin/herdr-jev", "panes", "--distilled"]
contexts = ["global"]

# Held messages are the whole confidence-floor design made visible: below the floor we
# do not guess, we ask. If holds are invisible, holding is just dropping.
[[actions]]
id = "jev:holds"
title = "Messages waiting for a human"
description = "Messages held because no pane scored high enough, or two tied"
command = ["./bin/herdr-jev", "hold", "list"]
contexts = ["global"]

# Run this first, and whenever a route goes somewhere surprising. The failure this
# design is organised against is confident misrouting, so every check names its fix.
[[actions]]
id = "jev:doctor"
title = "Check what herdr-jev needs"
description = "Herdr reachable, openjev discovered and ready, api version, config sane"
command = ["./bin/herdr-jev", "doctor"]
contexts = ["global", "pane"]

# The tier and flag mappings are guesses against vendor CLIs we have not verified, and a
# vendor renaming a flag is the one failure that degrades into a LIE rather than into
# pass-through: a confident log line above arguments the agent silently ignores. This
# reads each agent binary's own --help and reports ok / FAIL / ?? per mapping.
#
# A separate action rather than part of doctor, because it runs other people's binaries:
# plain doctor stays fast and offline, and this is never implied. It reports only — it
# never edits config, and routing works whether or not it has ever been run.
[[actions]]
id = "jev:probe"
title = "Verify the model mappings against the real agent binaries"
description = "Read each agent's own --help and report which flags and models it truly accepts"
command = ["./bin/herdr-jev", "doctor", "--probe"]
contexts = ["global"]

[[actions]]
id = "jev:status"
title = "herdr-jev status"
description = "openjev mode, url, phase, model; candidate count; holds"
command = ["./bin/herdr-jev", "status"]
contexts = ["global"]

# `--install` SYMLINKS rather than copies, so the skill cannot drift from the binary
# that implements it.
[[actions]]
id = "jev:skill"
title = "Print the herdr-jev agent skill"
command = ["./bin/herdr-jev", "skill"]
contexts = ["global"]

[[actions]]
id = "jev:install-skill"
title = "Install the herdr-jev agent skill"
description = "Symlink the skill into ~/.claude/skills and ~/.agents/skills"
command = ["./bin/herdr-jev", "skill", "--install"]
contexts = ["global"]

# --- panes ------------------------------------------------------------------

# Live routing decisions as they happen: message, winner, score, and the runners-up.
# This is the pane that makes the router auditable while you work rather than after.
[[panes]]
id = "jev:feed"
title = "Live decisions"
description = "Every task: answered locally, routed to a tier, or passed through — with scores"
command = ["./bin/herdr-jev", "feed"]
placement = "popup"
width = "80%"
height = 24

[[panes]]
id = "jev:status-watch"
title = "herdr-jev status"
description = "openjev phase and model, live candidate list, pending holds"
command = ["./bin/herdr-jev", "status", "--watch"]
placement = "popup"
width = "70%"
height = 20
