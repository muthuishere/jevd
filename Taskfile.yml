version: '3'

# The engine and the plugin build with different toolchains and are released on
# different clocks, so nothing here builds "everything" by default. `task check`
# is what CI runs and what you run before pushing.

tasks:
  default:
    cmds: [task: check]

  check:
    desc: Everything CI runs — fast, and never compiles llama.cpp
    cmds:
      - task: rust:fmt
      - task: rust:clippy
      - task: rust:test

  # --- rust -----------------------------------------------------------------
  # The default feature set deliberately excludes every llama.cpp backend: the
  # sys crate builds llama.cpp from a pinned submodule via cmake, which turns a
  # 20-second check into a multi-minute one. Backends are exercised by
  # `task rust:build:metal` / `:cuda` and by the release matrix, not by `check`.

  rust:fmt:
    desc: Formatting, checked not applied
    cmds: ['cargo fmt --all -- --check']

  rust:fix:
    desc: Apply formatting
    cmds: ['cargo fmt --all']

  rust:clippy:
    cmds: ['cargo clippy --workspace --all-targets -- -D warnings']

  rust:test:
    desc: Unit tests. No weights, no network, no GPU
    cmds: ['cargo test --workspace']

  rust:build:
    cmds: ['cargo build --workspace --release']

  rust:build:metal:
    desc: Release binary with the Metal backend (macOS; compiles llama.cpp)
    cmds: ['cargo build --release -p openjev-cli --features metal']

  rust:build:cuda:
    desc: Release binary with the CUDA backend (needs nvcc; compiles llama.cpp)
    cmds: ['cargo build --release -p openjev-cli --features cuda']

  # --- real weights ---------------------------------------------------------
  # Deliberately outside `check`: these need a converted GGUF, the tokenizer and the
  # extracted head, and they compile llama.cpp. Produce the artefacts with
  # `scripts/convert-model.sh <workdir>` and point OPENJEV_ARTEFACTS at <workdir>/out.
  #
  # Every test here passes silently when the env is unset, which keeps `check` green on a
  # machine with no weights — and means CI that intends to enforce the contract must set
  # OPENJEV_ARTEFACTS. Absence of the fixture is absence of evidence, not evidence of
  # correctness.
  golden:
    desc: The contract — our predict against the reference's probabilities
    env:
      OPENJEV_TEST_GGUF: '{{.OPENJEV_ARTEFACTS}}/openjev-4b-nli-v2-{{.Q | default "Q8_0"}}.gguf'
      OPENJEV_TEST_HEAD: '{{.OPENJEV_ARTEFACTS}}/score.safetensors'
      OPENJEV_TEST_TOKENIZER: '{{.OPENJEV_TOKENIZER}}'
      OPENJEV_TEST_DTYPE: '{{.Q | default "Q8_0" | lower}}'
    cmds:
      - cargo test --release -p openjev-core --features real-weights,backend-llamacpp
        --test golden -- --nocapture --test-threads=1

  systemone:
    desc: The owner's System One example against a RUNNING server with real weights
    # The weightless half of this contract runs in `check` (tests/systemone_e2e.rs, a real
    # Session over a stub backend). This is the other half: the same request, the real
    # checkpoint. Silently green without OPENJEV_SERVER_URL, so CI that means to enforce
    # it has to set the variable — absence of the fixture is absence of evidence.
    env:
      OPENJEV_SERVER_URL: '{{.OPENJEV_SERVER_URL | default "http://127.0.0.1:21131"}}'
    cmds:
      - cargo test -p openjev-cli --test systemone_live -- --nocapture

  bench:
    desc: Latency and throughput on real weights. Reports, never asserts
    env:
      OPENJEV_TEST_GGUF: '{{.OPENJEV_ARTEFACTS}}/openjev-4b-nli-v2-{{.Q | default "Q8_0"}}.gguf'
      OPENJEV_TEST_DTYPE: '{{.Q | default "Q8_0" | lower}}'
    cmds:
      # --test-threads=1 is load-bearing, not tidiness: two benchmarks sharing one GPU
      # measure each other's contention and report numbers ~30% high, with p95 blowing
      # out to 3x p50. A benchmark that races itself is worse than no benchmark.
      - cargo test --release -p openjev-core --features real-weights,backend-llamacpp
        --test bench -- --nocapture --test-threads=1

  bench:hw:
    desc: What this GPU can actually do — fp16 matmul TFLOP/s and bandwidth. macOS only
    cmds:
      - swiftc -O scripts/metal-peak.swift -o /tmp/openjev-metal-peak
      - /tmp/openjev-metal-peak

  # --- dev ------------------------------------------------------------------
  serve:
    desc: Run the server from source
    cmds: ['cargo run -p openjev-cli -- serve {{.CLI_ARGS}}']
